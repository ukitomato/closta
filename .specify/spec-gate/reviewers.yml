# この registry は `gate_common::reviewers_filter` が読む (gate-common.sh § 6b)。
# `enabled` / `gates` / `auto_invoke_patterns` / `exclude_patterns` の 4 つが効く。
#
# **`registry_filter_agents` だけでは効かない。** あちらは agent ファイルの存在しか
# 見ないため、skill の Phase から `reviewers_filter` を呼ぶこと。
#
# **効くのは code-gate と pr-gate だけである。** design-gate はまだ diff が無く
# `auto_invoke_patterns` が判定材料にならないため本ファイルを読まず、
# `.specify/.agents-registry.yaml` の `invoked_by` で reviewer を決める。
# したがって下の `gates:` に `design-gate` を書いても効果はない。
#
# **`reviewers_filter` は引数で渡された候補しか絞らない。** ここに entry を足したら
# 対象 gate skill (cl-code-gate Phase 2 / cl-pr-gate Phase 3) の候補リストにも
# 名前を足すこと。忘れると 1 度も起動せず `skipped_reviewers[]` にも出ない。
#
# **`scope:` は書かない。** parser は読まないので効果がなく、
# 「system scope だから絞られているはず」という誤解を生む。
# 絞り込みを決めるのは `auto_invoke_patterns` / `exclude_patterns` だけである。
# `source:` は由来のメモであり、これも判定には使われない。

reviewers:
  # ─────────────────────────────────────────────────────────────────────
  # a11y / ux は **pr-gate のみ**。code-gate では起動しない。
  #
  # code-gate Phase 3 は auto-fix loop の TAIL なので毎 iteration 再起動される
  # (`--max-iter` 既定 3 → 最大 4 回)。a11y / ux の指摘は `must_fix` に
  # 翻訳されないためループを 1 歩も進めないのに、生成コストだけを毎回払っていた
  # (002 の reviewer 出力は合計 398KB)。判断材料としては pr-gate で 1 回あれば足る。
  #
  # **対象は「著者が書いた本番画面」だけに絞る。**
  # `**/*.tsx` だと 36 ファイルが対象になるが、うち 22 は vendored (下の
  # `exclude_patterns`) であり、残りにも仮実装の画面が混ざる。
  # renderer は 1 画面 1 ディレクトリ (`features/<name>/<Name>Screen.tsx`) なので
  # **画面単位の glob で列挙する** — 新しい概念は要らない。
  # 本番 UI として確定した画面をここに足し、仮実装のうちはコメントアウトしておく。
  # ─────────────────────────────────────────────────────────────────────
  - name: a11y-reviewer
    enabled: true
    # chat (transcript) と session (セッション画面・監視ビュー) は R-3 以降本番の画面であり、
    # Constitution VIII / XII / XIII の Manual の検証者が当たるよう対象に入れる
    # (O-2 pr-gate R1 architecture H-001。利用者承認 2026-10-03)。
    auto_invoke_patterns:
      - "src/renderer/src/features/session-list/**/*.tsx"
      - "src/renderer/src/features/chat/**/*.tsx"
      - "src/renderer/src/features/session/**/*.tsx"
      # シェル (O-7。サイドバー・中央・右のペイン・設定と起動のダイアログ) は本番の画面の枠。文言の表とタブの表だけを
      # 変える PR でも起動する (O-7 code-gate convention L-010)。
      - "src/renderer/src/features/shell/**/*.tsx"
      - "src/renderer/src/features/shell/labels.ts"
      - "src/renderer/src/features/shell/panel-tabs.ts"
      - "src/renderer/src/App.tsx"
      # elements/ の手書きの表示 (R-4 の Tier A・O-2 の SystemEventRow と印など)。後続の表示 feature (O-4〜O-6) は
      # ここだけで完結しうるので明示で入れる (O-2 pr-gate R2 architecture M-101)。新しい手書きの element を足したらここにも足す。
      - "src/renderer/src/components/assistant-ui/elements/terminal-block.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/code-diff.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/todo-list.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/subagent.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/agent-plan.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-registry.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/thread.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/thread-list.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-fallback.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-result-marks.tsx"
      - "src/renderer/src/components/assistant-ui/elements/surfaces.tsx"
      # - "src/renderer/src/features/runtime-list/**/*.tsx"              # 仮実装
      # - "src/renderer/src/features/workspace-folders/**/*.tsx"         # 仮実装
      # - "src/renderer/src/features/folder-runtime-resolution/**/*.tsx" # 仮実装
    exclude_patterns:
      # **規模に関わらず常に除外する。** どちらも registry から生成した
      # vendored primitive であり、a11y 指摘は upstream の管轄である。
      # 直すと registry から乖離し、次の `add` で戻る。
      - "src/renderer/src/components/ui/**"                     # shadcn 生成 (8 files)
      # assistant-ui registry の複製 (CLI 生成物)。elements/ には手書きの表示も混在するので、
      # ディレクトリ単位ではなくファイル単位で除外する (O-2 pr-gate R2 architecture M-101)
      - "src/renderer/src/components/assistant-ui/elements/attachment.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/data-table.tsx"
      - "src/renderer/src/components/assistant-ui/elements/empty-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/error-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/file-tree.tsx"
      - "src/renderer/src/components/assistant-ui/elements/follow-up-suggestions.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/loading-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/reasoning.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/reasoning.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-group.aui.tsx"
      # O-4 が registry から手を入れずに取り込んだ element (014 research R-09 / tasks SH-011)。手を入れたら
      # 上の auto_invoke_patterns に移し、eslint.config.mjs の手書きの element の一覧に足す
      - "src/renderer/src/components/assistant-ui/elements/thinking-indicator.tsx"
      - "**/*.test.tsx"                                         # テストは a11y の対象ではない
    gates: [pr-gate]
    source: bootstrap-recommended

  - name: ux-reviewer
    enabled: true
    # a11y-reviewer と同一の対象。片方だけ広げると指摘の出所が追えなくなる。
    auto_invoke_patterns:
      - "src/renderer/src/features/session-list/**/*.tsx"
      - "src/renderer/src/features/chat/**/*.tsx"
      - "src/renderer/src/features/session/**/*.tsx"
      # シェル (O-7。サイドバー・中央・右のペイン・設定と起動のダイアログ) は本番の画面の枠。文言の表とタブの表だけを
      # 変える PR でも起動する (O-7 code-gate convention L-010)。
      - "src/renderer/src/features/shell/**/*.tsx"
      - "src/renderer/src/features/shell/labels.ts"
      - "src/renderer/src/features/shell/panel-tabs.ts"
      - "src/renderer/src/App.tsx"
      # elements/ の手書きの表示 (R-4 の Tier A・O-2 の SystemEventRow と印など)。後続の表示 feature (O-4〜O-6) は
      # ここだけで完結しうるので明示で入れる (O-2 pr-gate R2 architecture M-101)。新しい手書きの element を足したらここにも足す。
      - "src/renderer/src/components/assistant-ui/elements/terminal-block.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/code-diff.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/todo-list.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/subagent.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/agent-plan.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-registry.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/thread.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/thread-list.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-fallback.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-result-marks.tsx"
      - "src/renderer/src/components/assistant-ui/elements/surfaces.tsx"
      # - "src/renderer/src/features/runtime-list/**/*.tsx"              # 仮実装
      # - "src/renderer/src/features/workspace-folders/**/*.tsx"         # 仮実装
      # - "src/renderer/src/features/folder-runtime-resolution/**/*.tsx" # 仮実装
    exclude_patterns:
      - "src/renderer/src/components/ui/**"
      - "src/renderer/src/components/assistant-ui/elements/attachment.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/data-table.tsx"
      - "src/renderer/src/components/assistant-ui/elements/empty-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/error-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/file-tree.tsx"
      - "src/renderer/src/components/assistant-ui/elements/follow-up-suggestions.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/loading-state.tsx"
      - "src/renderer/src/components/assistant-ui/elements/reasoning.aui.tsx"
      - "src/renderer/src/components/assistant-ui/elements/reasoning.tsx"
      - "src/renderer/src/components/assistant-ui/elements/tool-group.aui.tsx"
      # O-4 が registry から手を入れずに取り込んだ element (a11y-reviewer と同じ)
      - "src/renderer/src/components/assistant-ui/elements/thinking-indicator.tsx"
      - "**/*.test.tsx"
    gates: [pr-gate]
    source: bootstrap-recommended

  - name: database-reviewer
    enabled: true
    # Principle V の検証対象は SQL のカラム型に限らない (AD-024 #9)。
    # R-1 の永続化は JSON であり、SQL パターンだけでは発火しない。
    # 永続化スキーマを持つ設定層のモジュールも発火条件に含める。
    auto_invoke_patterns:
      - "**/migrations/**"
      - "*.sql"
      - "**/schema.prisma"
      - "src/main/infra/settings/**"
      - "src/main/infra/secrets/**"
    gates: [code-gate, pr-gate]
    source: bootstrap-recommended

  - name: platform-boundary-reviewer
    enabled: true
    # ディレクトリは AD-023 のレイヤ構成に合わせる (AD-024 #1 / #6)。
    # `src/runtime/**` / `src/supervisor/**` は存在せず、旧条件では 1 件も発火しなかった。
    auto_invoke_patterns:
      - "src/main/infra/runtime/**"
      - "src/agents/**"
      - "src/domain/runtime/**"
      - "src/main/app/**"
      # 起動時の検出の結線・AD-038 の production-inert の門・Principle II の例外注記 (`platform-ok:`) を持つ
      # (O-7 pr-gate R1 platform-boundary M-002。code-gate で一度も見られなかった)。
      - "src/main/index.ts"
      - "scripts/constitution/**"
      - "**/eslint.config.*"
      - "**/.dependency-cruiser.*"
      - "**/.eslintrc*"
    # design-gate での起動は registry の `invoked_by` が決める (上の注記参照)。
    gates: [code-gate, pr-gate]
    source: project-specific

  - name: ui-coverage-reviewer
    enabled: true
    # O-2 (spec 011 / AD-044) で追加。docs/ui-coverage.md の**判断を要する点**だけを見る
    # (機械で確かめられることは Constitution 検証の項目 21 が CI で見る)。
    # 発火: 対応表そのもの、SDK の版 (package.json / lockfile)、SDK のメッセージを変換・描画するモジュール。
    auto_invoke_patterns:
      - "docs/ui-coverage.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/agents/**"
      - "src/domain/session/transcript*.ts"
      - "src/domain/session/live-message*.ts"
      - "src/domain/session/system-event*.ts"
      - "src/domain/session/tool-result*.ts"
      # SDK のメッセージの値を計量 (meter) に正規化する domain のモジュール (O-4 / 014 plan「機械強制の変更」)
      - "src/domain/session/meter*.ts"
      - "src/renderer/src/components/assistant-ui/elements/**"
      - "src/renderer/src/features/chat/**"
      # 実行中のシステムイベントの行の合成と SessionEvent の message のデコード (pr-gate R1 architecture M-004)
      - "src/renderer/src/features/session/running-session-store.ts"
      - "src/renderer/src/features/session/session-event-decoder.ts"
      # 稼働中の会話の表示の部品 (失敗と終了の告知・拒否の一覧。D 節の行) (O-7 pr-gate R1 ui-coverage M-003)
      - "src/renderer/src/features/session/LivePane.tsx"
      # 承認カード (D 節 permission-request・E 節 can_use_tool。Tier A)。LivePane の外の部品 (O-7 pr-gate R2 ui-coverage M-101)。
      # D 節の状態・失敗の文言の正本 (session/labels.ts・session-view.ts の rowStatus) は監視ビューと共有で、文言だけの
      # 変更でも起動してしまうので入れない (ファイルの側に「変えるときは対応表の行を見る」と書いた)
      - "src/renderer/src/features/session/ApprovalCard.tsx"
      # シェルの中央のヘッダ (D 節の session-state を描く)・右のペインのタブの表・「概要」の見出し (起動時の値)。後続の表示
      # feature (O-4〜O-6・OPT-panel) はここだけで完結しうるので明示で入れる (elements/** と同じ理由。O-7 pr-gate R1
      # ui-coverage M-003 / architecture M-004・R2 ui-coverage L-102)
      - "src/renderer/src/features/shell/panel-tabs.ts"
      - "src/renderer/src/features/shell/labels.ts"
      - "src/renderer/src/features/shell/**/*.tsx"
      - "scripts/ui-coverage/**"
    exclude_patterns:
      - "**/*.test.ts"
      - "**/*.test.tsx"
    gates: [pr-gate]
    source: project-specific

