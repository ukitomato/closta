# Spec-Driven Gating Workflow — Agents Registry
#
# 用途:
#   稼働中の全 subagent を列挙。skill が agent invoke 前に
#   `gate_common::registry_assert_agent <name>` で validate するための SSoT。
#
# Status 値:
#   required — 常に存在前提。`.claude/agents/<name>.md` と 1:1 で一致させる
#   optional — `/cl-add-reviewer` で有効化するまで agent ファイルは存在しない。
#              登録だけ先に置いてあり、`registry_filter_agents` が
#              ファイルの実在も見るため未 install のものは起動されない
#
# 編集ポリシー:
#   - agent ファイルを追加 / 削除したら同じコミットでここも直す
#   - ユーザ追加の custom reviewer は `managed_by: user` で末尾に追記
#
# 検証:
#   bash .specify/scripts/gate-common.sh registry-load   # 全エントリ列挙
#   bash .specify/scripts/gate-common.sh registry-assert <name>   # 個別検証

version: 1
schema_url: https://github.com/yukiyamato/spec-driven-gating-workflow/blob/main/docs/agents-registry-schema.md

agents:
  # ─── Shared base ────────────────────────────────────────────────────
  - name: reviewer-base
    status: required
    role: shared
    placement: .claude/agents/reviewer-base.md
    purpose: "全 reviewer の共通基盤 (frontmatter に name を持たないため spawn 対象外)"
    managed_by: workflow
    invoked_by: []  # 直接 invoke しない (Read のみ)

  # ─── Generic reviewers ──────────────────────────────────────────────
  - name: security-reviewer
    status: required
    role: generic
    placement: .claude/agents/security-reviewer.md
    purpose: "認証 / 認可 / secrets / injection / Electron のプロセス境界 hardening"
    managed_by: workflow
    invoked_by: [design-gate, pr-gate]

  - name: architecture-reviewer
    status: required
    role: generic
    placement: .claude/agents/architecture-reviewer.md
    purpose: "Constitution Principle drift / Charter / accepted ADR drift / layering"
    managed_by: workflow
    invoked_by: [design-gate, pr-gate]

  - name: po-reviewer
    status: required
    role: generic
    placement: .claude/agents/po-reviewer.md
    purpose: "User Story 価値 / SC 計測可能性 / Acceptance Criteria testability"
    managed_by: workflow
    invoked_by: [design-gate, pr-gate]

  - name: convention-reviewer
    status: required
    role: generic
    placement: .claude/agents/convention-reviewer.md
    purpose: "命名 / module 配置 / lint hookup"
    managed_by: workflow
    invoked_by: [code-gate]

  # ─── Actors ─────────────────────────────────────────────────────────
  - name: implementer
    status: required
    role: actor
    placement: .claude/agents/implementer.md
    purpose: "実装と修正の actor。tasks モード = tasks.md の section、fix モード = code-gate / pr-gate の指摘"
    managed_by: workflow
    invoked_by: [cl-implement, code-gate, pr-gate-fix]

  - name: lint-agent
    status: required
    role: actor
    placement: .claude/agents/lint-agent.md
    purpose: "project lint 実行 + JSON violations 出力"
    managed_by: workflow
    invoked_by: [code-gate]

  - name: test-agent
    status: required
    role: actor
    placement: .claude/agents/test-agent.md
    purpose: "project test 実行 + JSON pass/fail 出力"
    managed_by: workflow
    invoked_by: [code-gate]

  - name: designer
    status: required
    role: actor
    placement: .claude/agents/designer.md
    purpose: "/cl-plan・/cl-tasks の fork 先として設計文書を書き、design-gate の指摘を直す"
    managed_by: workflow
    invoked_by: [cl-plan, cl-tasks, cl-design]

  # ─── Optional reviewers (/cl-add-reviewer) ──────────────────────────
  - name: database-reviewer
    status: optional
    role: generic
    placement: .claude/agents/database-reviewer.md
    purpose: "永続化スキーマの互換性 / マイグレーション / 資格情報の置き場 (JSON 設定 + SQLite)"
    managed_by: workflow
    invoked_by: [code-gate, pr-gate]
    install_hint: "install 済み。発火条件は .specify/spec-gate/reviewers.yml"

  - name: a11y-reviewer
    status: optional
    role: generic
    placement: .claude/agents/a11y-reviewer.md
    purpose: "WCAG 2.1 AA / Aria / keyboard accessibility"
    managed_by: workflow
    invoked_by: [pr-gate]
    install_hint: "install 済み。発火条件は .specify/spec-gate/reviewers.yml"

  - name: api-performance-reviewer
    status: optional
    role: generic
    placement: .claude/agents/api-performance-reviewer.md
    purpose: "latency / caching / N+1 / pagination / payload size / rate limit"
    managed_by: workflow
    invoked_by: [pr-gate]
    install_hint: "未 install。`/cl-add-reviewer api-performance-reviewer` で有効化 (body は .specify/extensions/spec-gate/reviewers-optional/)"

  - name: openapi-contract-reviewer
    status: optional
    role: generic
    placement: .claude/agents/openapi-contract-reviewer.md
    purpose: "OpenAPI/Swagger 契約 drift / breaking change"
    managed_by: workflow
    invoked_by: [pr-gate]
    install_hint: "未 install。`/cl-add-reviewer openapi-contract-reviewer` で有効化 (body は .specify/extensions/spec-gate/reviewers-optional/)"

  - name: ux-reviewer
    status: optional
    role: generic
    placement: .claude/agents/ux-reviewer.md
    purpose: "empty/error/loading states / i18n / IA / user feedback path"
    managed_by: workflow
    invoked_by: [pr-gate]
    install_hint: "install 済み。発火条件は .specify/spec-gate/reviewers.yml"

  - name: platform-boundary-reviewer
    status: optional
    role: project-specific
    placement: .claude/agents/platform-boundary-reviewer.md
    purpose: "runtime/platform boundary: path type loss across IPC, single-instance assumptions, capability honesty, permission gate bypass, multi-hop path conversion, implicit persistence, lint rule coverage"
    managed_by: project
    invoked_by: [design-gate, code-gate, pr-gate]
    install_hint: "install 済み。Principle I/II/III/VI/VII と AD-003/004/012 の drift を owner とする"

  - name: ui-coverage-reviewer
    status: optional
    role: project-specific
    placement: .claude/agents/ui-coverage-reviewer.md
    purpose: "docs/ui-coverage.md judgement: table updated in the same PR as display changes, assignment kind and Tier validity, follow-up feature scope, SDK version bumps. Principle XII / AD-044 owner. Does not repeat check:constitution item 21"
    managed_by: project
    invoked_by: [pr-gate]
    install_hint: "O-2 (spec 011) で追加。機械照合は Constitution 検証の項目 21"
