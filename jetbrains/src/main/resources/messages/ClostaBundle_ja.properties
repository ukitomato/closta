# SessionStatus.kt
session.failure.launchFailed.cause=Claude Code を起動できませんでした: {0}
session.failure.launchFailed.remedy=Claude Code をインストールし、ターミナルで claude コマンドが動くことを確かめてください。{0} PATH にすでにあるフォルダーに claude を置いただけなら、セッションを再起動してください。
session.failure.workingDirectoryMissing.cause=Claude Code を起動できませんでした: 作業フォルダー {0} が見つかりません。
session.failure.workingDirectoryMissing.remedy=この会話が worktree の中だったなら、その worktree は消されたのかもしれません。「新しい会話」か「新しい会話（worktree）」で新しく会話を開いてください。
session.failure.wslUnavailable.cause=WSL で Claude Code を起動できませんでした: {0}
session.failure.wslUnavailable.remedy=WSL のディストリビューション {0} が起動すること（ターミナルで wsl -d {0}）と、プロジェクトのフォルダーがその中にあることを確かめてから、セッションを再起動してください。
session.failure.wslCommandNotFound.cause=claude がコード 127 で終了しました: 必要なコマンドが WSL のディストリビューション {0} で見つかりません。
session.failure.wslCommandNotFound.remedy={0} でターミナルを開き（wsl -d {0}）、ログインシェルで claude --version が動くこと、claude のフォルダーがそこで設定した PATH にあることを確かめてから、セッションを再起動してください。
session.failure.commandNotFound.cause=claude がコード 127 で終了しました: 必要なコマンドが PATH で見つかりません。
session.failure.commandNotFound.remedy=claude と、claude が使うランタイムがターミナルで動くことを確かめてください。{0} PATH にすでにあるフォルダーにインストールしただけなら、セッションを再起動してください。
session.failure.endedAbnormally.cause=Claude のセッションが予期せず終了しました（{0}）。
session.failure.endedAbnormally.remedy=プロジェクトのフォルダーでターミナルから claude を動かして止まる理由を確かめてから、セッションを再起動してください。
session.failure.versionCheckFailed.cause=claude --version が成功しませんでした（{0}）。
session.failure.versionCheckFailed.remedy=ターミナルで claude --version を動かしてインストールを確かめてから、セッションを再起動してください。
session.failure.planFailed.cause=Claude の起動設定を用意できませんでした（{0}）。
session.failure.planFailed.remedy=Closta のプロバイダー設定を確かめてから、セッションを再起動してください。
session.failure.projectNotTrusted.cause=Claude Code を起動しませんでした: このプロジェクトは信頼されていません。
session.failure.projectNotTrusted.remedy=Claude Code はプロジェクトのフォルダーにあるコマンドや設定を実行できます。このプロジェクトを信頼するなら、セーフモードの通知か「ヘルプ | アクションを検索」から「プロジェクトを信頼…」を選び、セッションを再起動してください。
session.failure.bedrockSignInCancelled.cause=Claude Code を起動しませんでした: Amazon Bedrock へのサインインが取り消されました。
session.failure.bedrockSignInCancelled.remedy=セッションを再起動し、MFA デバイスの新しいコードでサインインしてください。
session.failure.bedrockKeysMissing.cause=Claude Code を起動しませんでした: 新しいセッション用の Amazon Bedrock プロバイダーに、長期の AWS アクセスキーが保存されていません。
session.failure.bedrockKeysMissing.remedy=設定 | ツール | Closta でプロバイダーのアクセスキー ID とシークレットアクセスキーを入れてから、セッションを再起動してください。
session.failure.bedrockSecretsUnavailable.cause=Claude Code を起動しませんでした: IDE のパスワード保存先が応答しませんでした。
session.failure.bedrockSecretsUnavailable.cause.reason=Claude Code を起動しませんでした: IDE のパスワード保存先が応答しませんでした（{0}）。
session.failure.bedrockSecretsUnavailable.remedy=設定 | 外観 \\& 振る舞い | システム設定 | パスワード でパスワードの保存先を確かめてから、セッションを再起動してください。
session.failure.bedrockSettingsChanged.cause=Claude Code を起動しませんでした: サインインの間に Amazon Bedrock プロバイダーの設定が変わりました。
session.failure.bedrockSettingsChanged.remedy=セッションを再起動し、今の設定でサインインしてください。
session.failure.forkIdMismatch.cause=CLI は、プラグインが渡した id で分けた会話を開きませんでした。
session.failure.forkIdMismatch.remedy=「保存した会話を再開」で開くか、セッションを再起動してください。
session.failure.rewindPointMissing.cause=この会話を巻き戻せませんでした: 保存された記録にそのメッセージがないか、記録を読めませんでした。
session.failure.rewindPointMissing.remedy=「保存した会話を再開」で会話を開くか、セッションを再起動してください。
session.failure.pathKept=IDE は起動したときの PATH を使い続けます。PATH を変えたなら IDE を再起動してください（PATH をシェルだけで設定しているなら、ターミナルから起動してください）。
session.failure.exitCode=終了コード {0}
