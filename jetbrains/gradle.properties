group = dev.ukitomato
version = 0.1.0

# The IntelliJ Platform ships the Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.caching = true

# Memory for CI, whose runner has 16 GB: the defaults run out compiling the plugin. A machine's own
# ~/.gradle/gradle.properties wins over these, so a smaller local setting still holds.
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs = -Xmx3g
