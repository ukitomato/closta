# R-1 の機械検証を CI で常時回す (SH-022 / SC-008 / SC-009)。
#
# **ランナーは Windows を基準**とする。R-1 の検証対象の大半は Windows 固有である —
# `wsl.exe` の呼び出し面、UNC 経路、ドライブレター、パス正規化。
# Linux ランナーで回すと「通ったが実機の条件を見ていない」状態になる。
# WSL 自体はランナーに無いので、実機でしか確かめられない分 (SC-004 / SC-005) は
# quickstart V-1 〜 V-7 が担う。CI はここを肩代わりしない。
#
# Node は AD-013 のとおり **Active LTS (24) を基準**とし、Current (26) は
# 許容失敗ジョブで回す。実行時の言語機能を決めるのは Electron 同梱 Node であり
# ホスト Node ではないため、Current の失敗で CI 全体を止めない。

name: verify

on:
  push:
    branches: [main]
  pull_request:

# 同じ ref の古い実行は打ち切る。main は打ち切らない。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: windows-latest

    strategy:
      # Current が落ちても LTS 側の結果は最後まで見たい。
      fail-fast: false
      matrix:
        include:
          - node: 24
            allow-failure: false
          - node: 26
            allow-failure: true

    continue-on-error: ${{ matrix.allow-failure }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # `packageManager` フィールドを置いていないので明示する。
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # 以降は **1 検証 1 ステップ**にする。まとめると、どの検証が落ちたかが
      # ログを読まないと分からない。
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: depcruise
        run: pnpm depcruise

      - name: check:constitution
        run: pnpm check:constitution

      - name: test
        run: pnpm test

      # **違反サンプルを展開して各検証が発火することを確かめる** (SC-008 / SC-017)。
      # 上の lint / depcruise / check:constitution が「違反 0 件」を示すだけでは、
      # ルールが効いているのか 1 件も一致していないのかを区別できない (AD-025)。
      - name: test:rules
        run: pnpm test:rules

      - name: build
        run: pnpm build

      # supervisor の単独起動の煙試験 (Principle VII / AD-010 / AD-043 Decision 6 / SC-009。X-5 pr-gate R1 platform-boundary L-004)。
      # ビルド成果物の supervisor と worker のチャンクが読み込むのは `node:` の標準モジュールと SDK だけで、空の標準入力で起こすと
      # exit 0 で終わること。読み込み先は**許可リストで**見る — 素の node 下の `require("electron")` はパス文字列に解決して
      # 例外にならず、共有チャンク (`require("./…")`) 経由の混入は名前の一致では捕まらないため (X-5 pr-gate R2
      # platform-boundary L-101 / architecture L-107)。共有チャンクが切り出されたら、ここで失敗させてから検査対象を広げる。
      - name: smoke (supervisor の単独起動)
        shell: pwsh
        run: |
          $sup = (Get-ChildItem out/main -Filter 'supervisor-*.js').FullName
          $wrk = (Get-ChildItem out/main -Filter 'sdk-agent-session-*.js').FullName
          $specs = Select-String -Path $sup, $wrk -AllMatches -Pattern '(?:require\(|import\(|from\s*)"([^"]+)"' |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $bad = $specs | Where-Object { $_ -notmatch '^node:' -and $_ -ne '@anthropic-ai/claude-agent-sdk' }
          if ($bad) { throw "supervisor / worker のチャンクが許可外のモジュールを読み込んでいる: $($bad -join ', ')" }
          '' | node $sup "--worker-entry=$wrk"
          if ($LASTEXITCODE -ne 0) { throw "supervisor が exit $LASTEXITCODE で終わった" }

  # **Principle VIII の Automated 2 項目** (IME E2E / 日本語スクリーンショット比較) を Electron 実起動で回す
  # (X-2 / AD-038 / SC-006 / FR-009-012)。**Windows ランナーで GUI 起動**する。
  #
  # **credential-free** — CLOSTA_E2E stub (`src/main/app/e2e-capability.ts`。`!app.isPackaged && CLOSTA_E2E==='1'`
  # で production-inert) が real な WSL・Claude 認証・秘密なしに有効 composer へ到達させる (H-3 / Principle V)。
  # 独立ブラウザは取らない — `_electron.launch` がアプリ同梱 Chromium を使う (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD)。
  # env 単独ゲート禁止のため CLOSTA_E2E は job env でなく `e2e/support/launch.ts` が `_electron.launch` に渡す。
  #
  # **移設対象外は載せない** (FR-011): スクロール安定 E2E / Principle IX 到達集合検査は roadmap の deferred feature に残す。
  e2e:
    name: e2e (Japanese IME / screenshot / launch dialog / multi-session)
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      # 以降も **1 検証 1 ステップ**。IME E2E は既存ガードを殺す差分で落ちる (FR-012 の回帰固定)。
      - name: e2e (IME 変換確定 Enter が送信にならない)
        run: pnpm exec playwright test e2e/ime.spec.ts -c playwright.config.ts

      # 日本語スクリーンショット比較 (FR-010 / SC-002)。**同梱フォント (`e2e/fonts/*.ttf`) と承認済み基準画像
      # (`e2e/**/*.png`) が commit 済みであることが前提** (H-101 / AD-038 D4・D5 / quickstart V-2 の人間承認)。
      # フォント・基準画像を整備する前に本ステップを gating で有効化すると CI が赤になる — 整備後に commit すること。
      - name: e2e (日本語スクリーンショット比較)
        run: pnpm exec playwright test e2e/composer-screenshot.spec.ts -c playwright.config.ts

      # E2E の型検査 (`e2e/` は src のグラフ外で lint / typecheck の対象外。AD-038 D2)。Playwright は型検査せずに
      # transpile するため、型の崩れはここでしか見えない (X-5 code-gate convention M-005)。
      - name: typecheck (e2e)
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json

      # 実機計測 (`perf/`。O-1 FR-012) は**型検査だけ**を行い、実行しない (実 claude と実資格情報を要する。AD-038 D3)。
      # 設定 (`playwright.perf.config.ts`) も CI で読み込むと例外で止まる。
      - name: typecheck (perf)
        run: pnpm exec tsc --noEmit -p perf/tsconfig.json

      # 起動設定ダイアログ (X-4 SC-001 / SC-002 / SC-004)。
      - name: e2e (起動設定ダイアログ)
        run: pnpm exec playwright test e2e/launch-dialog.spec.ts -c playwright.config.ts

      # マルチセッション (X-5 SC-001 / SC-003 / SC-006)。SC-003 の負荷計測は「入力遅延 p95 ≤ 50ms かつ long task の
      # 最大 < 100ms」で判定し、件数は annotation に記録するだけ (実行環境の揺れで件数が変わるため。spec SC-003)。
      - name: e2e (マルチセッション)
        run: pnpm exec playwright test e2e/multi-session.spec.ts -c playwright.config.ts

      # サイドバーの過去のセッションの区画 (O-3 FR-018 / SC-008。O-7 の義務 (iii))。日本語スクリーンショット比較
      # (`sidebar-past-sessions`) と、既定のウィンドウで compact の 10 行を出しても見出しと検索欄が見えることの確認の 2 ケース。
      # 基準画像は本機で作らず、本ステップが落ちた回の artifact (`e2e-test-results`) の actual を利用者が承認してから
      # `e2e/sidebar-screenshot.spec.ts-snapshots/` に commit する (AD-038 D5 / 012 quickstart-results V-4)。commit するまで
      # 本ステップは基準画像が無くて落ちる (偽の緑にしない。012 pr-gate R1 C-001)。他の E2E の結果を先に見るため最後に置く。
      - name: e2e (サイドバーの過去のセッションの区画)
        run: pnpm exec playwright test e2e/sidebar-screenshot.spec.ts -c playwright.config.ts

      # 失敗したときだけ、Playwright の出力 (スクリーンショット比較の expected / actual / diff を含む) を取り出せるようにする。
      # 中身は E2E stub の固定文言だけ (credential-free。AD-038 D3)。基準画像を CI の描画で取り直すときに使う (O-1 PR #10)。
      - name: upload e2e results (失敗時)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
