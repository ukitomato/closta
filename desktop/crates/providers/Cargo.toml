[package]
name = "closta-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The test doubles (the in-memory process, the spawner, the fake session) and the AgentSession
# contract, for this crate's tests and for the crates that drive a session in theirs.
fake = ["dep:smol"]

[dependencies]
async-channel.workspace = true
async-io.workspace = true
async-process.workspace = true
base64.workspace = true
closta-core.workspace = true
closta-model.workspace = true
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
smol = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
blocking.workspace = true
# Turns `fake` on for this crate's own tests.
closta-providers = { path = ".", features = ["fake"] }
sha2.workspace = true

# The stand-in for the claude CLI that the process tests launch.
[[bin]]
name = "closta-fake-claude"
path = "src/bin/closta_fake_claude.rs"

[lints]
workspace = true
