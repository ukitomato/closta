[package]
name = "closta-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GPUI's frame timings, for the measuring build.
profiler = ["gpui-kit/profiler"]

[dependencies]
closta-presenter.workspace = true
closta-session.workspace = true
closta-shell.workspace = true
futures-lite.workspace = true
gpui-kit = { workspace = true, features = ["syntect"] }

[target.'cfg(windows)'.dependencies]
# The process's own CPU time and working set, for the measuring run.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[lints]
workspace = true
