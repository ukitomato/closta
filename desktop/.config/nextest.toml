# The flat-fold test measures wall time in debug, so it must not share the machine with others.
[[profile.default.overrides]]
filter = 'test(fold_time_per_line_stays_flat)'
threads-required = "num-test-threads"

# Tests that start child processes. The fake CLI also starts grandchildren, so few run at once.
[test-groups]
child-processes = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(/^process_/) | binary(real_cli)'
test-group = 'child-processes'
slow-timeout = { period = "60s", terminate-after = 2 }
