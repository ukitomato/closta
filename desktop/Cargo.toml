[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order", "float_roundtrip"] }
sha2 = "0.11"
imbl = "7.0.2"
base64 = "0.23.1"
cargo_metadata = "0.23"
thiserror = "2"
async-channel = "2.5"
async-io = "2.6"
async-process = "2.5"
rustix = { version = "1.1", features = ["process"] }
blocking = "1.7"
futures-lite = "2.6"
uuid = { version = "1.29", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-appender = "0.2.3"
smol = "2"
windows = "0.62"
windows-registry = "0.6"
gpui-kit = "=0.9.0"
closta-model = { path = "crates/model" }
closta-core = { path = "crates/core" }
closta-presenter = { path = "crates/presenter" }
closta-providers = { path = "crates/providers" }
closta-session = { path = "crates/session" }
closta-goldens = { path = "crates/goldens" }
closta-platform = { path = "crates/platform" }
closta-shell = { path = "crates/shell" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
