[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.23"
gpui-kit = "=0.9.0"
closta-model = { path = "crates/model" }
closta-core = { path = "crates/core" }
closta-presenter = { path = "crates/presenter" }
closta-providers = { path = "crates/providers" }
closta-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
