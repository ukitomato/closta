# Electron のパッケージングツールチェーンは node_modules が npm と同じ形で
# 物理的にディスク上に存在することを要求する。pnpm の既定のシンボリックリンク
# 方式とは非互換なため hoisted を指定する。
# https://www.electronjs.org/docs/latest/tutorial/tutorial-first-app
#
# 注: pnpm 10 以降、本ファイルは workspace 定義だけでなく設定ファイルも兼ねる。
# `packages:` キーを持たないため monorepo ではない。
# discovery-scanner は本ファイルの存在を monorepo marker として扱うので、
# 次回 /spec-gate scan の結果を読むときは注意すること。
nodeLinker: hoisted

# pnpm 12 はビルドスクリプトの許可を本ファイルの `allowBuilds` で見る。
# `package.json` の `pnpm.onlyBuiltDependencies` は参照されない (AD-023 の検証済み事実)。
# 許可を 2 箇所に置くと SSoT が割れるため、scaffold 由来の
# `pnpm.onlyBuiltDependencies` は削除し、本ファイルを正本とする。
#
# `electron-winstaller` は Squirrel 用で本プロジェクトは使わない。
# `false` を明示しないと install が `ERR_PNPM_IGNORED_BUILDS` で失敗する。
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # `eslint-import-resolver-typescript` の解決エンジン。postinstall で
  # プラットフォーム固有のネイティブバインディングを配置する。
  unrs-resolver: true
